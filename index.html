<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/sideBar.css" />
    <link rel="stylesheet" href="./css/topBar.css" />
    <link rel="stylesheet" href="./css/chat.css" />
    <script src="./main.js" defer></script>
</head>

<body>
    <section class="supportPage">
        <div class="row">
            <div class="sideBar">
                <div class="sideBarHead">
                    <div class="logo">
                        <img src="./imgs/logo.svg" alt="Logo" class="logoImg" width="100%" />
                    </div>
                    <img src="./imgs/menu.svg" alt="menu" width="20" />
                </div>
                <div class="sideBarContent">
                    <ul class="sideBarList"></ul>
                </div>
            </div>
            <div class="mainSec">
                <div class="topBar">
                    <div class="topBarContent">
                        <div class="search-container">
                            <input type="text" placeholder="Search" />
                            <img src="./imgs/searchIcon.svg" alt="search" class="search-icon" />
                        </div>
                        <div class="topBarIcons">
                            <div class="langBox">
                                <img src="./imgs/lang.svg" alt="lang" width="17px" />
                                <div class="langText">English</div>
                                <img src="./imgs/arrow-down.svg" alt="arrow-down" width="10px" />
                            </div>

                            <div class="pro">
                                <img src="./imgs/crown White.svg" alt="pro" width="20" />
                            </div>
                            <div class="notfy">
                                <img src="./imgs/notifications.svg" alt="notifications" />
                            </div>
                            <div class="userInfo">
                                <img src="./imgs/images 1.png" class="userImg" alt="user image" />
                                <div class="info">
                                    <p class="userName">Restutant</p>
                                    <span class="profileBtn"> View Profile </span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="mainContent">
                    <div class="mainContentHead">
                        <p class="navStep">
                            Settings/ Customer Service <span>/ Reply</span>
                        </p>
                    </div>
                    <div class="mainContentBody">
                        <div class="chatBox">
                            <div class="chatBoxHead">
                                <div class="ticketId">#874512135462</div>
                                <div class="ticketInfo">
                                    <div class="info">
                                        <span>Ahmed Ali</span>
                                        <span>04-Apr-2025, 2:45 PM</span>
                                        <span>Open</span>
                                    </div>
                                    <div class="ticketAction">
                                        <button class="pendingBtn">Mark As Pending</button>
                                        <button class="resolveBtn">Mark As Resolved</button>
                                    </div>
                                </div>
                            </div>
                            <div class="chatBoxBody">
                                <div class="chatContainer">
                                </div>

                                <div class="input-bar">
                                    <input type="text" placeholder="Type your message..." />
                                    <button>
                                        <svg width="20" height="20" fill="white" viewBox="0 0 24 24">
                                            <path d="M2 21l21-9L2 3v7l15 2-15 2v7z" />
                                        </svg>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
    </section>
</body>

</html>
